[project]
name = "anomaly-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for unsupervised anomaly detection models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
# Use importlib import mode to avoid name collisions across
# models/*/tests/ directories that share the same filenames.
addopts = "--import-mode=importlib"
testpaths = ["tests", "models"]
