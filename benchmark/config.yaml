# Benchmark configuration
# ======================
# This is the single configuration file for the benchmark.
# CLI flags override values here.

# ── Benchmark mode ───────────────────────────────────────────────────
# "main"    — primary model-selection benchmark (max available train data)
# "fewshot" — supplementary low-data robustness study (nested subsets)
benchmark_mode: "main"

dataset_id: "wood"

seeds: [42, 1337, 2026]

# n_train_ok is now derived from the dataset registry for main mode.
# For fewshot mode, the few_shot_levels from the registry are used.
# This field is kept for backward compatibility / explicit override only.
# n_train_ok: <use_registry_default>

preprocessing_mode: "baseline" # baseline | high_accuracy | edge_safe
image_size: 224 # derived from mode, but explicit for clarity

batch_size_eval: 1 # always 1 for latency measurement

models:
  - patchcore
  - rd_plus_plus
  - simplenet
  - anomalydino

# Thresholding
threshold_strategy: "quantile"
threshold_quantile_p: 0.98

# Runtime profiling
warmup_iterations: 10
measured_iterations: 30

# Paths (relative to repository root)
paths:
  datasets_root: "datasets"
  splits_root: "splits"
  experiments_root: "experiments"
