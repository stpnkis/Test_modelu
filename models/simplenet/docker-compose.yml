# =============================================================================
# Docker Compose - SimpleNet Experiment
# =============================================================================
# Run from this directory: docker compose run --rm simplenet python src/run_benchmark.py
# GPU access via NVIDIA Container Toolkit (requires: docker context use default)
# =============================================================================

services:
  simplenet:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: '8gb'
    gpus: all
    environment:
      - PYTHONPATH=/app
      - HOME=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Datasets (read-only)
      - ../../datasets:/app/datasets:ro
      # Git metadata for commit traceability in results
      - ../../.git:/app/.git:ro
      # Centralized splits (shared across models)
      - ../../splits:/app/splits
      # Centralized experiment results (shared across models)
      - ../../experiments:/app/experiments
      # Shared benchmark module
      - ../../shared:/app/shared:ro
      # Live source code mount — edit without rebuilding the image
      - ./src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
