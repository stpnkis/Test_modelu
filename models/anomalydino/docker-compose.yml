# =============================================================================
# Docker Compose — AnomalyDINO Experiment
# =============================================================================
# Usage:
#   docker compose build
#   docker compose run --rm anomalydino python src/experiment_runner.py
#
# GPU access requires NVIDIA Container Toolkit.
# =============================================================================

services:
  anomalydino:
    build: .
    shm_size: "8gb"
    environment:
      - PYTHONPATH=/app
    volumes:
      # Datasets (read-only)
      - ../../datasets:/app/datasets:ro
      # Legacy dataset mount (backward compat)
      - ../../dataset:/app/dataset:ro
      # Centralized splits (shared across models)
      - ../../splits:/app/splits
      # Centralized experiment results (shared across models)
      - ../../experiments:/app/experiments
      # Shared benchmark module
      - ../../shared:/app/shared:ro
      # Live source mount — edit code without rebuilding the image
      - ./src:/app/src
      - ./tests:/app/tests
      # Persist DINOv2 hub cache so weights aren't re-downloaded each run
      - dino_hub_cache:/root/.cache/torch/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  dino_hub_cache:
